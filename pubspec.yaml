name: nile_voice
description: A voice room application with biometric authentication.
publish_to: 'none'

version: 1.0.4+5

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.10.5+9
  agora_rtc_engine: ^6.3.0
  permission_handler: ^11.3.0
  socket_io_client: ^2.0.3+1
  local_auth: ^2.1.6
  webview_flutter: ^4.10.0
  http: ^1.2.0
  image_picker: ^1.0.7
  url_launcher: ^6.3.0

  # Face Liveness Detection & Voice Guidance Packages
  google_mlkit_face_detection: ^0.10.0
  flutter_tts: ^3.8.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/chicken_game/
    - assets/gifts/
