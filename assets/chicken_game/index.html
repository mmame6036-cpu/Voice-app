<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chicken Road</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background: #131722; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #fff; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
    
    /* Top Banner */
    #top-bar { height: 32px; background: #1b2130; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; font-size: 11px; border-bottom: 1px solid #2a3245; }
    .badge { background: #f59e0b; color: #000; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
    
    /* Game Canvas Board */
    #game-container { flex: 1; position: relative; overflow-x: auto; overflow-y: hidden; background: #262c3d; display: flex; align-items: stretch; }
    #road { display: flex; height: 100%; min-width: max-content; }
    
    .start-zone { width: 70px; background: #10b981; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; font-size: 12px; border-right: 2px solid #059669; }
    .lane { width: 72px; height: 100%; background: #1e2433; border-right: 1px dashed #374151; position: relative; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding-bottom: 8px; cursor: pointer; }
    .lane.active { background: #2d3748; }
    .lane-lid { background: #111827; border: 1px solid #4b5563; border-radius: 12px; padding: 2px 6px; font-size: 10px; color: #fbbf24; font-weight: bold; }
    .lane-num { font-size: 9px; color: #9ca3af; margin-top: 2px; }
    
    .car { position: absolute; font-size: 24px; transition: top 0.05s linear; }
    .chicken { position: absolute; font-size: 28px; bottom: 40px; }

    /* Controls Bottom */
    #controls { height: 95px; background: #0f131c; padding: 8px 12px; display: flex; flex-direction: column; justify-content: space-between; border-top: 1px solid #1f2937; }
    .diff-row { display: flex; justify-content: space-between; gap: 6px; }
    .diff-btn { flex: 1; padding: 5px 0; background: #1f293d; border: none; border-radius: 6px; color: #9ca3af; font-size: 10px; font-weight: bold; }
    .diff-btn.selected { background: #fbbf24; color: #000; }
    
    .action-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .bet-box { display: flex; align-items: center; background: #1e2538; border-radius: 8px; padding: 2px 8px; }
    .bet-btn { background: none; border: none; color: #38bdf8; font-size: 18px; font-weight: bold; padding: 4px 8px; cursor: pointer; }
    .bet-val { font-size: 12px; font-weight: bold; margin: 0 4px; min-width: 55px; text-align: center; }
    
    #play-btn { flex: 1; height: 38px; background: #10b981; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; color: #000; cursor: pointer; }
    #play-btn.cashout { background: #f59e0b; }
  </style>
</head>
<body>

  <div id="top-bar">
    <span id="status-text">ውርርድ ይምረጡና PLAY ይጫኑ!</span>
    <span class="badge" id="balance-badge">BALANCE: <span id="balance-val">0</span></span>
  </div>

  <div id="game-container">
    <div id="road">
      <div class="start-zone">
        <span style="font-size: 28px;" id="start-chicken">🐔</span>
        <span>START</span>
      </div>
      <!-- 30 Lanes will be rendered here -->
    </div>
  </div>

  <div id="controls">
    <div class="diff-row">
      <button class="diff-btn" onclick="setDifficulty('EASY')">EASY</button>
      <button class="diff-btn selected" onclick="setDifficulty('MEDIUM')">MEDIUM</button>
      <button class="diff-btn" onclick="setDifficulty('HARD')">HARD</button>
      <button class="diff-btn" onclick="setDifficulty('HELL')">HELL</button>
    </div>

<div class="action-row">
      <div class="bet-box">
        <button class="bet-btn" onclick="adjustBet(-50)">-</button>
        <span class="bet-val" id="bet-display">BET 100</span>
        <button class="bet-btn" onclick="adjustBet(50)">+</button>
      </div>
      <button id="play-btn" onclick="onPlayOrCashOut()">PLAY</button>
    </div>
  </div>

  <script>
    const MULTIPLIERS = {
      EASY: [1.03, 1.06, 1.10, 1.15, 1.21, 1.28, 1.36, 1.45, 1.56, 1.68, 1.82, 1.98, 2.17, 2.39, 2.65, 2.96, 3.33, 3.77, 4.31, 4.97, 5.79, 6.82, 8.14, 9.87, 12.18, 15.34, 19.82, 26.43, 36.85, 54.12],
      MEDIUM: [1.08, 1.21, 1.37, 1.56, 1.78, 2.05, 2.37, 2.77, 3.24, 3.85, 4.62, 5.61, 6.91, 8.64, 10.99, 14.29, 18.96, 26.07, 37.24, 53.82, 82.36, 137.59, 256.36, 638.82, 2457.0, 5800.0, 12000.0, 24000.0, 48000.0, 96000.0],
      HARD: [1.18, 1.46, 1.83, 2.31, 2.95, 3.82, 5.02, 6.66, 9.04, 12.52, 17.74, 25.80, 38.71, 60.21, 97.40, 166.87, 305.94, 595.86, 1283.03, 3267.64, 10891.94, 62182.19, 150000.0, 300000.0, 600000.0, 1200000.0, 2500000.0, 5000000.0, 10000000.0, 20000000.0],
      HELL: [1.44, 2.21, 3.45, 5.53, 9.09, 15.09, 26.78, 48.70, 92.54, 185.08, 391.25, 894.28, 2235.72, 6096.15, 18600.32, 64232.79, 267920.8, 800000.0, 2400000.0, 7200000.0, 21600000.0, 64800000.0, 194400000.0, 583200000.0, 1000000000.0, 2000000000.0, 4000000000.0, 8000000000.0, 16000000000.0, 32000000000.0]
    };

    let difficulty = 'MEDIUM';
    let bet = 100;
    let isPlaying = false;
    let currentLane = 0;
    let userCoins = 0;

    const roadEl = document.getElementById('road');
    const playBtn = document.getElementById('play-btn');
    const statusText = document.getElementById('status-text');

    function renderLanes() {
      const mults = MULTIPLIERS[difficulty];
      const existingLanes = document.querySelectorAll('.lane');
      existingLanes.forEach(el => el.remove());

      for (let i = 1; i <= 30; i++) {
        const lane = document.createElement('div');
        lane.className = 'lane';
        lane.id = 'lane-' + i;
        lane.onclick = () => stepToLane(i);
        lane.innerHTML = 
          <div class="lane-lid">${mults[i-1]}x</div>
          <div class="lane-num">${i}</div>
        ;
        roadEl.appendChild(lane);
      }
    }

    function setDifficulty(diff) {
      if (isPlaying) return;
      difficulty = diff;
      document.querySelectorAll('.diff-btn').forEach(b => b.classList.toggle('selected', b.innerText === diff));
      renderLanes();
    }

    function adjustBet(delta) {
      if (isPlaying) return;
      bet = Math.max(50, bet + delta);
      document.getElementById('bet-display').innerText = 'BET ' + bet;
    }

    function onPlayOrCashOut() {
      if (!isPlaying) {
        // Send BET message to Flutter
        if (window.AppBridge) {
          window.AppBridge.postMessage('BET:' + bet);
        } else {
          startRound();
        }
      } else {
        // Cash out
        if (currentLane === 0) return;
        const mult = MULTIPLIERS[difficulty][currentLane - 1];
        const win = Math.round(bet * mult);
        if (window.AppBridge) {
          window.AppBridge.postMessage('WIN:' + win);
        }
        endRound(🎉 አሸነፉ! +${win} ተሰብስቧል!);
      }
    }

    function startRound() {
      isPlaying = true;
      currentLane = 0;
      playBtn.innerText = 'WAIT';
      playBtn.className = 'cashout';
      statusText.innerText = 'ዶሮዋን ለማሻገር መስመሩን ይንኩ!';
      document.getElementById('start-chicken').style.display = 'block';
    }

    function stepToLane(target) {
      if (!isPlaying || target !== currentLane + 1) return;

      const crashChance = difficulty === 'EASY' ? 0.08 : difficulty === 'MEDIUM' ? 0.16 : difficulty === 'HARD' ? 0.28 : 0.42;
      if (Math.random() < crashChance) {
        endRound('💥 ተገጩ! ውርርዱ ተበልቷል!');
        return;
      }

      currentLane = target;
      document.getElementById('start-chicken').style.display = 'none';
      document.querySelectorAll('.chicken').forEach(e => e.remove());

const laneEl = document.getElementById('lane-' + currentLane);
      const ch = document.createElement('div');
      ch.className = 'chicken';
      ch.innerText = '🐔';
      laneEl.appendChild(ch);

      const mult = MULTIPLIERS[difficulty][currentLane - 1];
      const curWin = Math.round(bet * mult);
      playBtn.innerText = CASH OUT (+${curWin});
      statusText.innerText = ደረጃ ${currentLane} ተሻገሩ! (${mult}x);

      laneEl.scrollIntoView({ behavior: 'smooth', inline: 'center' });

      if (currentLane === 30) {
        const jackpot = Math.round(bet * MULTIPLIERS[difficulty][29]);
        if (window.AppBridge) window.AppBridge.postMessage('WIN:' + jackpot);
        endRound(🏆 ጃክፖት! +${jackpot} አሸነፉ!);
      }
    }

    function endRound(msg) {
      isPlaying = false;
      currentLane = 0;
      playBtn.innerText = 'PLAY';
      playBtn.className = '';
      statusText.innerText = msg;
      document.querySelectorAll('.chicken').forEach(e => e.remove());
      document.getElementById('start-chicken').style.display = 'block';
    }

    // Called from Flutter to update coins
    window.onBalanceUpdated = function(coins) {
      userCoins = coins;
      document.getElementById('balance-val').innerText = coins;
    };

    window.onBetConfirmed = function() {
      startRound();
    };

    renderLanes();
  </script>
</body>
</html>
