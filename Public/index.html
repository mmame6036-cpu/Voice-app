<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nile Voice - Admin Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: #0b0f17; color: #f1f5f9; padding: 24px; }
    .container { max-width: 1000px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 24px; border-bottom: 1px solid #1e293b; margin-bottom: 24px; }
    h1 { color: #00c9a7; font-size: 24px; }
    .badge { background: #1e293b; padding: 6px 12px; border-radius: 20px; font-size: 13px; color: #94a3b8; }
    .card { background: #131b26; border: 1px solid #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 24px; }
    h2 { font-size: 18px; margin-bottom: 16px; color: #f8fafc; }
    .form-group { display: flex; gap: 12px; margin-bottom: 12px; }
    input[type="text"] { flex: 1; background: #0b0f17; border: 1px solid #334155; border-radius: 8px; padding: 12px 16px; color: #fff; font-size: 14px; }
    input[type="text"]:focus { outline: none; border-color: #00c9a7; }
    button { background: #00c9a7; color: #0b0f17; border: none; padding: 12px 20px; border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.2s; }
    button:hover { opacity: 0.9; }
    button.reject { background: #ef4444; color: #fff; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid #1e293b; font-size: 14px; }
    th { color: #94a3b8; font-weight: 600; background: #0f172a; }
    .status-pending { color: #f59e0b; font-weight: 600; }
    .status-agent { color: #00c9a7; font-weight: 600; }
    .msg { padding: 10px; border-radius: 6px; font-size: 13px; margin-top: 8px; display: none; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Nile Voice Management Console</h1>
      <span class="badge">Master Admin</span>
    </header>

    <!-- 1. Agent Management Panel -->
    <div class="card">
      <h2>Assign / Revoke Agent (Coin Seller)</h2>
      <div class="form-group">
        <input type="text" id="targetAgentId" placeholder="Enter User ID (e.g. 1001, 1002)...">
        <button onclick="toggleAgentRole(true)">Promote to Agent</button>
        <button class="reject" onclick="toggleAgentRole(false)">Revoke Agent</button>
      </div>
      <div id="agentMsg" class="msg"></div>
    </div>

    <!-- 2. Pending Recharges Panel -->
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 14px;">
        <h2>Recharge Verification Requests</h2>
        <button style="padding: 6px 14px; font-size: 13px;" onclick="fetchPendingPayments()">Refresh</button>
      </div>
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>User ID</th>
              <th>Method</th>
              <th>TxID</th>
              <th>Coins</th>
              <th>Paid</th>
              <th>Date</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="paymentsTable">
            <tr><td colspan="7" style="text-align:center; color:#64748b;">Loading requests...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    async function toggleAgentRole(isAgent) {
      const userId = document.getElementById('targetAgentId').value.trim();
      const msg = document.getElementById('agentMsg');
      if (!userId) {
        alert('Please enter a valid User ID');
        return;

}
      try {
        const res = await fetch('/api/admin/toggle-agent', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId, isAgent })
        });
        const data = await res.json();
        msg.style.display = 'block';
        msg.style.background = data.success ? '#064e3b' : '#7f1d1d';
        msg.style.color = '#fff';
        msg.innerText = data.message || (data.success ? 'Success' : 'Failed');
      } catch (err) {
        alert('Network error: ' + err.message);
      }
    }

    async function fetchPendingPayments() {
      const tbody = document.getElementById('paymentsTable');
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:#64748b;">Fetching latest payments...</td></tr>';
      try {
        const res = await fetch('/api/admin/pending-payments');
        const json = await res.json();
        if (json.success && json.data.length > 0) {
          tbody.innerHTML = '';
          json.data.forEach(p => {
            const tr = document.createElement('tr');
            tr.innerHTML = 
              <td><strong>${p.userId}</strong></td>
              <td>${p.paymentMethod}</td>
              <td><span style="font-family:monospace; color:#38bdf8;">${p.txId}</span></td>
              <td style="color:#facc15; font-weight:bold;">${p.amountCoins.toLocaleString()}</td>
              <td>${p.pricePaid}</td>
              <td style="color:#64748b; font-size:12px;">${new Date(p.createdAt).toLocaleDateString()}</td>
              <td>
                <button style="padding:6px 12px; font-size:12px;" onclick="approvePayment('${p._id}')">Approve</button>
              </td>
            ;
            tbody.appendChild(tr);
          });
        } else {
          tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:#64748b;">No pending requests found.</td></tr>';
        }
      } catch (err) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:#ef4444;">Failed to load payments.</td></tr>';
      }
    }

    async function approvePayment(paymentId) {
      if (!confirm('Are you sure you want to approve this recharge and transfer coins?')) return;
      try {
        const res = await fetch('/api/admin/approve-payment', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ paymentId })
        });
        const data = await res.json();
        if (data.success) {
          alert('Recharge Approved Successfully!');
          fetchPendingPayments();
        } else {
          alert('Error: ' + data.message);
        }
      } catch (err) {
        alert('Server connection error: ' + err.message);
      }
    }

    // Initial load
    fetchPendingPayments();
  </script>
</body>
</html>
