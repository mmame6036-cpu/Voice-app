name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Backup Firebase Config
        run: |
          find . -name "*google-services*.json" -exec cp {} /tmp/google-services.json \; || true

      - name: Recreate Android Platform
        run: |
          rm -rf android
          flutter create . --platforms=android --org=com.nile --project-name=voiceapp
          # Fix the Gradle 504 Timeout URL immediately after creation
          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i 's|https\\://services.gradle.org/distributions/|https\\://services.gradle.org/distributions/|g' android/gradle/wrapper/gradle-wrapper.properties
            sed -i 's|github.com/gradle/gradle-distributions/releases/download|services.gradle.org/distributions|g' android/gradle/wrapper/gradle-wrapper.properties
            sed -i 's|gradle-7.6.3-all.zip|gradle-7.6.3-bin.zip|g' android/gradle/wrapper/gradle-wrapper.properties
          fi

      - name: Restore Firebase Config and Setup Plugins
        run: |
          mkdir -p android/app
          if [ -f /tmp/google-services.json ]; then
            cp /tmp/google-services.json android/app/google-services.json
          elif [ -f google-services.json ]; then
            cp google-services.json android/app/google-services.json
          fi

          if [ ! -f android/app/google-services.json ]; then
            echo "ERROR: google-services.json file not found!"
            exit 1
          fi

          cat << 'EOF' > android/build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath "com.android.tools.build:gradle:7.3.0"
                  classpath "com.google.gms:google-services:4.4.1"
              }
          }

          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.buildDir = '../build'
          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
          }
          subprojects {
              project.evaluationDependsOn(':app')
          }

          tasks.register("clean", Delete) {
              delete rootProject.buildDir
          }
          EOF

          echo 'apply plugin: "com.google.gms.google-services"' >> android/app/build.gradle

      - name: Configure Gradle Settings
        run: |
          mkdir -p ~/.gradle
          cat << 'EOF' > ~/.gradle/init.gradle
          allprojects {
              buildscript {
                  repositories {
                      google()
                      mavenCentral()
                  }
              }
              repositories {
                  google()
                  mavenCentral()
              }
              afterEvaluate { project ->
                  if (project.hasProperty("android")) {
                      android {
                          compileSdkVersion 34
                          defaultConfig {
                              minSdkVersion 23
                              targetSdkVersion 34
                          }
                      }
                  }
              }
          }
          EOF
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>'

           android/app/src/main/AndroidManifest.xml

      - name: Restore Permanent Keystore
        run: |
          mkdir -p ~/.android
          rm -f ~/.android/debug.keystore
          keytool -genkeypair -alias androiddebugkey -keypass android -keystore ~/.android/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 10000 -keyalg RSA -keysize 2048

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: voice-app-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
