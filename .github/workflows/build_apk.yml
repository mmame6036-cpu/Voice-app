name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Recreate Android Project Platform
        run: flutter create . --platforms=android

      - name: Force Compile SDK 34
        run: |
          cat << 'EOF' > fix_sdk.py
          import re
          path = 'android/app/build.gradle'
          with open(path, 'r') as f:
              content = f.read()
          content = re.sub(r'compileSdk\s*=.*', 'compileSdk = 34', content)
          content = re.sub(r'compileSdkVersion\s+.*', 'compileSdkVersion 34', content)
          content = re.sub(r'targetSdk\s*=.*', 'targetSdk = 34', content)
          content = re.sub(r'targetSdkVersion\s+.*', 'targetSdkVersion 34', content)
          with open(path, 'w') as f:
              f.write(content)
          EOF
          python3 fix_sdk.py

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: voice-app-apk
          path: build/app/outputs/flutter-apk/*.apk
