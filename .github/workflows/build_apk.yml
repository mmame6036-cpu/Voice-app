name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Recreate Android Project Platform
        run: flutter create . --platforms=android

      - name: Fix Android SDK Versions
        run: |
          python3 -c "
          import os, glob, re

          gradle_files = glob.glob('android/app/build.gradle*')
          for path in gradle_files:
              with open(path, 'r') as f:
                  txt = f.read()
              txt = re.sub(r'compileSdk\s*=.*', 'compileSdk = 34', txt)
              txt = re.sub(r'compileSdkVersion\s+.*', 'compileSdkVersion 34', txt)
              txt = re.sub(r'targetSdk\s*=.*', 'targetSdk = 34', txt)
              txt = re.sub(r'targetSdkVersion\s+.*', 'targetSdkVersion 34', txt)
              txt = re.sub(r'minSdk\s*=.*', 'minSdk = 21', txt)
              txt = re.sub(r'minSdkVersion\s+.*', 'minSdkVersion 21', txt)
              with open(path, 'w') as f:
                  f.write(txt)
              print('Updated SDK in:', path)
          "

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: voice-app-apk
          path: build/app/outputs/flutter-apk/*.apk
